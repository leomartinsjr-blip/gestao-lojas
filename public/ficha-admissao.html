<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151D" media="(prefers-color-scheme: dark)">
<title>Ficha de Admissão</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!-- Herda os tokens da Torre (cores, tipografia, tema, celular). A folha
     abaixo desenha só o que é daqui: a lista, o formulário e o papel. -->
<link rel="stylesheet" href="/style.css">
<style>
body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', system-ui, sans-serif; }
.hidden { display: none !important; }

/* ── Topo ─────────────────────────────────────────────────────────────── */
.fa-top {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 1.25rem; padding-top: env(safe-area-inset-top, 0px);
  height: calc(54px + env(safe-area-inset-top, 0px));
  display: flex; align-items: center; gap: .75rem;
}
.fa-back {
  display: flex; align-items: center; gap: .3rem;
  background: transparent; border: 1px solid var(--border); border-radius: var(--r-sm);
  color: var(--muted); font: inherit; font-size: .78rem; padding: .3rem .6rem;
  cursor: pointer; white-space: nowrap;
}
.fa-back:hover { color: var(--text); border-color: var(--border2); }
.fa-ident { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
.fa-kicker {
  font-family: 'Big Shoulders Display', 'Archivo Narrow', system-ui, sans-serif;
  font-weight: 700; font-size: .68rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted); line-height: 1;
}
.fa-titulo {
  font-family: 'Big Shoulders Display', 'Archivo Narrow', system-ui, sans-serif;
  font-weight: 800; font-size: 1.15rem; letter-spacing: .02em;
  text-transform: uppercase; color: var(--text); line-height: 1;
}
.fa-top-acoes { margin-left: auto; display: flex; align-items: center; gap: .4rem; }

.fa-btn {
  display: inline-flex; align-items: center; gap: .35rem;
  background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-sm);
  color: var(--text2); font: inherit; font-size: .76rem; font-weight: 500;
  padding: .34rem .65rem; cursor: pointer; white-space: nowrap; text-decoration: none;
  transition: border-color .15s, color .15s;
}
.fa-btn:hover { color: var(--text); border-color: var(--border2); }
.fa-btn.solido { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.fa-btn.solido:hover { color: var(--on-accent); opacity: .9; }
.fa-btn.perigo:hover { color: var(--down); border-color: rgba(var(--down-rgb), .4); }
.fa-btn:disabled { opacity: .45; cursor: default; }

/* ── Corpo ────────────────────────────────────────────────────────────── */
.fa-body { max-width: 980px; margin: 0 auto; padding: 1.15rem 1.25rem calc(5rem + env(safe-area-inset-bottom, 0px)); }
.fa-erro {
  background: rgba(var(--down-rgb), .1); border: 1px solid rgba(var(--down-rgb), .35);
  color: var(--down); border-radius: var(--r-sm); padding: .5rem .7rem;
  font-size: .8rem; margin-bottom: .7rem;
}
.fa-estado { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: .88rem; line-height: 1.6; }
.fa-vazio { padding: 1.1rem .95rem; color: var(--muted); font-size: .82rem; }

/* ── Seções da lista ──────────────────────────────────────────────────── */
.fa-sec-titulo { display: flex; align-items: center; gap: .6rem; margin: 1.4rem 0 .6rem; }
.fa-sec-titulo:first-child { margin-top: .2rem; }
.fa-sec-titulo h2 {
  margin: 0; font-family: 'Big Shoulders Display', 'Archivo Narrow', system-ui, sans-serif;
  font-weight: 700; font-size: 1.15rem; letter-spacing: .03em; text-transform: uppercase;
  color: var(--text); line-height: 1;
}
.fa-sec-rule { flex: 1; height: 1px; background: var(--border); }
.fa-sec-cont { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: .72rem; color: var(--muted); }

.fa-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); overflow: hidden; margin-bottom: 1rem;
  box-shadow: 0 1px 2px var(--shadow-1);
}
.fa-scroll { overflow-x: auto; overscroll-behavior-x: contain; }
table.fa-t { width: 100%; border-collapse: collapse; font-size: .8rem; }
table.fa-t th {
  padding: .5rem .85rem .4rem; text-align: left;
  font-size: .62rem; font-weight: 500; text-transform: uppercase; letter-spacing: .07em;
  color: var(--muted); white-space: nowrap; border-bottom: 1px solid var(--border);
}
table.fa-t td { padding: .5rem .85rem; white-space: nowrap; border-bottom: 1px solid rgba(var(--border-rgb), .55); }
table.fa-t tr:last-child td { border-bottom: none; }
table.fa-t tr.clicavel { cursor: pointer; }
table.fa-t tr.clicavel:hover td { background: rgba(var(--accent-rgb), .06); }
table.fa-t td.fa-seta { text-align: right; color: var(--muted); width: 1%; }
.fa-nome { font-weight: 500; }
.fa-nome.sem { color: var(--muted); font-weight: 400; font-style: italic; }
.fa-loja { display: inline-flex; align-items: center; gap: .4rem; }
.fa-tarja { display: inline-block; width: 3px; height: 13px; border-radius: 2px; flex-shrink: 0; }
.fa-mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: .72rem; color: var(--muted); }
.fa-chip {
  display: inline-block; font-size: .64rem; font-weight: 600;
  padding: .08rem .45rem; border-radius: 999px; white-space: nowrap;
}
.fa-chip.enviada    { background: rgba(var(--warn-rgb), .15);   color: var(--warn); }
.fa-chip.preenchida { background: rgba(var(--accent-rgb), .15); color: var(--accent); }
.fa-chip.recebida   { background: rgba(var(--up-rgb), .15);     color: var(--up); }

/* ── A ficha aberta ───────────────────────────────────────────────────── */
.fa-cab {
  display: flex; align-items: flex-start; gap: 1rem; flex-wrap: wrap;
  padding: .85rem 1rem; border-bottom: 1px solid var(--border);
}
.fa-cab-emp { display: flex; flex-direction: column; gap: .15rem; min-width: 0; flex: 1; }
.fa-cab-emp b { font-size: .92rem; font-weight: 600; letter-spacing: -.012em; }
.fa-cab-meta { display: flex; flex-direction: column; gap: .2rem; align-items: flex-end; font-size: .74rem; color: var(--muted); text-align: right; }
.fa-aviso {
  display: flex; align-items: flex-start; gap: .6rem;
  background: rgba(var(--warn-rgb), .12); border: 1px solid rgba(var(--warn-rgb), .35);
  border-radius: var(--r-md); padding: .6rem .85rem; margin: .85rem 1rem 0;
  font-size: .82rem; line-height: 1.5;
}
.fa-aviso.critico { background: rgba(var(--down-rgb), .1); border-color: rgba(var(--down-rgb), .35); }
.fa-aviso b { color: var(--text); }
.fa-obs { margin: .85rem 1rem 0; font-size: .82rem; color: var(--text2); line-height: 1.5; }
.fa-obs b { color: var(--muted); font-weight: 500; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; margin-right: .4rem; }

.fa-form-sec { padding: .9rem 1rem .3rem; }
.fa-form-sec h3 {
  margin: 0 0 .7rem; font-family: 'Big Shoulders Display', 'Archivo Narrow', system-ui, sans-serif;
  font-weight: 700; font-size: 1rem; letter-spacing: .04em; text-transform: uppercase; color: var(--accent);
}
.fa-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .6rem .7rem; }
.fa-campo { display: flex; flex-direction: column; gap: .22rem; grid-column: span 2; min-width: 0; }
.fa-campo.full { grid-column: 1 / -1; }
.fa-campo.wide { grid-column: span 4; }
.fa-campo.w3 { grid-column: span 3; }
.fa-campo.narrow { grid-column: span 1; }
.fa-campo label { font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fa-campo input, .fa-campo select, .fa-campo textarea {
  background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--r-sm);
  color: var(--text); font: inherit; font-size: .85rem; padding: .42rem .55rem; width: 100%; min-width: 0;
}
.fa-campo input:focus, .fa-campo select:focus, .fa-campo textarea:focus { outline: none; border-color: var(--accent); }
.fa-campo input:disabled, .fa-campo select:disabled { opacity: .7; cursor: not-allowed; }
.fa-campo .dica { font-size: .7rem; color: var(--muted); }

table.fa-dep { width: 100%; border-collapse: collapse; font-size: .82rem; margin-bottom: .6rem; }
table.fa-dep th { text-align: left; font-size: .64rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; padding: 0 .3rem .3rem 0; }
table.fa-dep td { padding: 0 .3rem .4rem 0; }
table.fa-dep td:first-child { width: 50%; }
table.fa-dep input {
  background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--r-sm);
  color: var(--text); font: inherit; font-size: .85rem; padding: .38rem .5rem; width: 100%; min-width: 0;
}
table.fa-dep input:focus { outline: none; border-color: var(--accent); }

/* Barra de ações presa embaixo: a ficha é comprida e o botão de enviar tem
   que estar à mão em qualquer ponto dela, principalmente no celular. */
.fa-acoes-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: .55rem 1.25rem calc(.55rem + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
}
.fa-acoes-bar .fa-salvo { font-size: .72rem; color: var(--muted); margin-right: auto; font-family: 'IBM Plex Mono', ui-monospace, monospace; }
.fa-acoes-bar .fa-salvo.salvando { color: var(--warn); }
.fa-acoes-bar .fa-salvo.erro { color: var(--down); }

/* ── Histórico ────────────────────────────────────────────────────────── */
.fa-hist { padding: .5rem 1rem .9rem; font-size: .74rem; color: var(--muted); line-height: 1.7; }
.fa-hist b { color: var(--text2); font-weight: 500; }

/* ── Modal ────────────────────────────────────────────────────────────── */
.fa-overlay {
  position: fixed; inset: 0; z-index: 700; background: var(--shadow-3);
  display: flex; align-items: center; justify-content: center; padding: 1rem;
}
.fa-modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  width: 100%; max-width: 520px; max-height: 92dvh; overflow-y: auto;
  box-shadow: 0 20px 60px var(--shadow-3);
}
.fa-modal-hdr { display: flex; align-items: center; gap: .6rem; padding: .8rem 1rem; border-bottom: 1px solid var(--border); }
.fa-modal-hdr h3 { margin: 0; font-size: .92rem; font-weight: 600; }
.fa-modal-fechar {
  margin-left: auto; background: none; border: none; color: var(--muted);
  font-size: 1.05rem; cursor: pointer; padding: .2rem .4rem; line-height: 1; min-width: 34px; min-height: 34px;
}
.fa-modal-body { padding: .95rem 1rem 1.1rem; }
.fa-modal-body .fa-grid { grid-template-columns: 1fr; }
.fa-modal-body .fa-campo { grid-column: auto; }
.fa-modal-pe { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1rem; }

/* ── Celular ──────────────────────────────────────────────────────────── */
@media (max-width: 820px) {
  .fa-top { padding-left: .6rem; padding-right: .6rem; gap: .5rem; }
  .fa-kicker { display: none; }
  .fa-titulo { font-size: 1rem; }
  .fa-body { padding: .8rem .6rem calc(6rem + env(safe-area-inset-bottom, 0px)); }
  .fa-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fa-campo, .fa-campo.wide, .fa-campo.w3 { grid-column: span 2; }
  .fa-campo.narrow { grid-column: span 1; }
  .fa-campo input, .fa-campo select, table.fa-dep input { font-size: 16px; }
  .fa-cab-meta { align-items: flex-start; text-align: left; }
  .fa-rotulo { display: none; }
  .fa-acoes-bar { padding-left: .6rem; padding-right: .6rem; }
  table.fa-t td.oculta-cel, table.fa-t th.oculta-cel { display: none; }
}

/* ══════════════════════════════════════════════════════════════════════
   O PAPEL — a ficha como o candidato vê: monta-se a partir do que foi
   digitado e só existe na impressão. Campo vazio vira linha para caneta.
   ══════════════════════════════════════════════════════════════════════ */
#papel { display: none; }
@page { size: A4; margin: 12mm 13mm; }
@media print {
  body > *:not(#papel) { display: none !important; }
  body { background: #fff; color: #000; }
  #papel {
    display: block; font-family: Arial, Helvetica, sans-serif; font-size: 10.5pt;
    color: #000; line-height: 1.35; -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .p-cab { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 3pt; margin-bottom: 8pt; }
  .p-cab h1 { margin: 0; font-size: 16pt; letter-spacing: .08em; text-transform: uppercase; }
  .p-cab small { font-size: 8.5pt; color: #333; }
  .p-sec { margin: 9pt 0 4pt; font-size: 9pt; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid #000; padding-bottom: 1pt; }
  .p-sec small { font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 8pt; margin-left: 6pt; }
  .p-r { display: flex; gap: 10pt; margin: 4.5pt 0; align-items: flex-end; }
  .p-f { display: flex; align-items: flex-end; gap: 4pt; flex: 1; min-width: 0; }
  .p-f.fixo { flex: 0 0 auto; }
  .p-f.curto { flex: 0 0 90pt; }
  .p-f.medio { flex: 0 0 150pt; }
  .p-l { font-size: 8pt; font-weight: 700; text-transform: uppercase; white-space: nowrap; letter-spacing: .02em; }
  .p-v { flex: 1; border-bottom: 1px solid #000; min-height: 13pt; padding: 0 3pt 1pt; font-size: 10.5pt; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-v.data { flex: 0 0 80pt; text-align: center; font-variant-numeric: tabular-nums; }
  .p-v.hora { flex: 0 0 48pt; text-align: center; }
  .p-marca { font-size: 9pt; white-space: nowrap; margin-right: 6pt; }
  .p-marca b { font-family: 'Courier New', monospace; font-weight: 700; }
  table.p-dep { width: 100%; border-collapse: collapse; margin-top: 3pt; font-size: 10pt; }
  table.p-dep th { text-align: left; font-size: 8pt; text-transform: uppercase; padding: 2pt 4pt; border-bottom: 1px solid #000; }
  table.p-dep td { padding: 4pt 4pt 2pt; border-bottom: 1px solid #000; height: 15pt; }
  table.p-dep td.c { text-align: center; }
  .p-ass { display: flex; gap: 24pt; margin-top: 22pt; }
  .p-ass .p-f:first-child { flex: 0 0 130pt; }
  .p-rod { margin-top: 10pt; font-size: 7.5pt; color: #555; text-align: right; }
}
</style>
</head>
<body>

<header class="fa-top">
  <button class="fa-back" id="btnVoltar">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    <span class="fa-rotulo" id="voltarRotulo">Voltar</span>
  </button>
  <div class="fa-ident">
    <span class="fa-kicker" id="kicker">Torre de Controle</span>
    <span class="fa-titulo">Ficha de Admissão</span>
  </div>
  <div class="fa-top-acoes" id="topAcoes"></div>
</header>

<div class="fa-body">
  <div id="erroBox" class="fa-erro hidden"></div>
  <div id="lista" class="hidden"></div>
  <div id="ficha" class="hidden"></div>
  <div id="carregando" class="fa-estado">Carregando…</div>
</div>

<div class="fa-acoes-bar hidden" id="acoesBar"></div>

<!-- Modal genérico: nova ficha e devolução usam o mesmo corpo -->
<div class="fa-overlay hidden" id="overlay">
  <div class="fa-modal">
    <div class="fa-modal-hdr">
      <h3 id="modalTitulo">—</h3>
      <button class="fa-modal-fechar" id="modalFechar" title="Fechar">✕</button>
    </div>
    <div class="fa-modal-body" id="modalBody"></div>
  </div>
</div>

<!-- O papel: montado pelo JS na hora de imprimir -->
<div id="papel"></div>

<script src="ficha-admissao.js"></script>
</body>
</html>
