<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Gestão Operacional</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<script>
  // Mesmo tema escolhido no painel (ui:tema), antes de pintar
  try { const t = localStorage.getItem('ui:tema'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (_) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .n { font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .pag { max-width: 1320px; margin: 0 auto; padding: 18px 20px 48px; }
  .topo-crm { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .topo-crm h1 { font-family: 'Big Shoulders Display', 'Archivo Narrow', system-ui, sans-serif; font-size: 30px; font-weight: 800; margin: 2px 0 0; }
  .topo-crm .sub { color: var(--muted); font-size: 13px; }
  .lnk { color: var(--muted); font-size: 13px; text-decoration: none; }
  .lnk:hover { color: var(--accent); }
  .btn-crm { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; background: var(--accent); color: var(--on-accent, #fff); font-weight: 600; font-size: 13px; text-decoration: none; }

  .filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .chip { border: 1px solid var(--border2); background: var(--surface); color: var(--text2); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; }
  .chip.on { border-color: var(--accent); background: rgba(var(--accent-rgb), .1); color: var(--accent); font-weight: 600; }
  .ponto { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .kpi .rot { font-size: 12px; color: var(--muted); }
  .kpi .val { font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .det { font-size: 12px; color: var(--text2); margin-top: 2px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .card .nota { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .grade2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; margin-bottom: 16px; }
  .grade2 > .card { margin-bottom: 0; }

  /* Status da meta: cor + texto (nunca só a cor) */
  .ok   { color: var(--up); }
  .aten { color: var(--warn); }
  .ruim { color: var(--down); }

  /* Barras de cadastro por loja, com a meta marcada */
  .barras { display: flex; flex-direction: column; gap: 12px; }
  .barra { display: grid; grid-template-columns: 96px minmax(0, 1fr) 58px; gap: 10px; align-items: center; font-size: 13px; }
  .barra .nome { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trilho { position: relative; height: 12px; background: var(--surface3); border-radius: 0 4px 4px 0; }
  .trilho .enche { height: 100%; border-radius: 0 4px 4px 0; }
  .trilho .meta { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text2); left: 90%; }
  .barra .v { text-align: right; font-weight: 600; }
  .legenda-meta { font-size: 12px; color: var(--muted); margin-top: 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .legenda-meta i { display: inline-block; width: 2px; height: 12px; background: var(--text2); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th.n, td.n { text-align: right; }
  .tabela { overflow-x: auto; }
  tr.loja td { background: var(--surface2); font-weight: 600; }
  tr.inativo td:first-child { color: var(--muted); }
  th[data-ord] { cursor: pointer; user-select: none; }
  th[data-ord]:hover { color: var(--text); }
  th.ordenado { color: var(--accent); }
  .tag { font-size: 11px; color: var(--muted); font-weight: 400; }

  /* Mapa mês × loja: cada célula traz o número escrito */
  .mapa th, .mapa td { text-align: center; }
  .mapa td:first-child, .mapa th:first-child { text-align: left; }
  .mapa td.cel { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; border: 2px solid var(--surface); border-radius: 6px; padding: 6px 4px; }
  .mapa td.cel.ok   { background: color-mix(in srgb, var(--up) 16%, transparent); }
  .mapa td.cel.aten { background: color-mix(in srgb, var(--warn) 18%, transparent); }
  .mapa td.cel.ruim { background: color-mix(in srgb, var(--down) 16%, transparent); }
  .mapa td.cel.vazia { color: var(--muted); font-weight: 400; }

  .vazio { padding: 40px 16px; text-align: center; color: var(--muted); }
  .erro { color: var(--down); }
  .carregando { opacity: .55; transition: opacity .2s; }

  @media (max-width: 860px) {
    .grade2 { grid-template-columns: minmax(0, 1fr); }
    .pag { padding: 14px 14px 40px; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi .val { font-size: 21px; }
    /* Primeira coluna fixa ao rolar a tabela de lado */
    .fixa td:first-child, .fixa th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
    .fixa tr.loja td:first-child { background: var(--surface2); }
  }
</style>
</head>
<body>
<div class="pag">
  <div class="topo-crm">
    <div>
      <a class="lnk" href="/">&larr; Voltar ao painel</a>
      <h1>CRM</h1>
      <div class="sub" id="sub">Cadastro de clientes, campanhas e vendedores</div>
    </div>
    <a class="btn-crm" href="https://crm-lojas.onrender.com" target="_blank" rel="noopener">Abrir o CRM &rarr;</a>
  </div>
  <div class="filtros" id="filtros"></div>
  <div id="conteudo"><div class="vazio">Carregando…</div></div>
</div>
<script src="crm.js"></script>
</body>
</html>
