<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planejamento de Compras</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<style>
  :root {
    --bg: #f4f6f9; --bg2: #ffffff; --bg3: #f0f3f7; --border: #dde3ea; --border2: #b9c2cd;
    --text: #1f2328; --text2: #636c76; --green: #1a7f37; --red: #cf222e; --yellow: #9a6700;
    --blue: #0969da; --topbar-h: 52px; color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; min-height: 100vh; }
  #cp-topbar { position: fixed; top: 0; left: 0; right: 0; min-height: var(--topbar-h); background: var(--bg2); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; padding: 8px 16px; z-index: 100; flex-wrap: wrap; }
  .cp-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .cp-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text2); cursor: pointer; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
  .cp-btn:hover { color: var(--blue); border-color: var(--blue); }
  .cp-btn:disabled { opacity: .5; cursor: default; }
  .cp-filtros { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  select, input[type=text] { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 4px 8px; font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { background: none; border: none; color: var(--text2); padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .seg button.active { background: rgba(9,105,218,.1); color: var(--blue); font-weight: 600; }
  #cp-body { margin-top: calc(var(--topbar-h) + 4px); padding: 16px; max-width: 1700px; }
  .abas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .aba { background: var(--bg2); border: 1px solid var(--border); border-radius: 18px; color: var(--text2); padding: 6px 14px; font-size: 12px; cursor: pointer; }
  .aba.active { border-color: var(--blue); color: var(--blue); background: rgba(9,105,218,.08); font-weight: 600; }
  .aba .alerta { color: var(--red); font-weight: 700; margin-left: 4px; }
  .painel { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
  .painel-hd { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .painel-hd h2 { font-size: 13px; font-weight: 600; flex: 1; }
  .nota { color: var(--text2); font-size: 11px; padding: 8px 14px; border-top: 1px solid var(--border); line-height: 1.55; }
  .muted { color: var(--text2); }
  .pos { color: var(--green); } .neg { color: var(--red); } .warn { color: var(--yellow); } .azul { color: var(--blue); }
  /* premissas */
  .prem { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 12px 14px; }
  .prem label { display: grid; gap: 3px; font-size: 11px; color: var(--text2); }
  .prem input { width: 100%; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
  .prem input.dig { border-color: var(--yellow); background: #fff8e6; }
  .prem .calc { font-size: 11px; color: var(--text2); }
  .prem .calc b { color: var(--text); font-variant-numeric: tabular-nums; }
  /* tabela */
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { background: var(--bg3); color: var(--text2); font-size: 10px; font-weight: 600; padding: 7px 9px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; text-transform: uppercase; letter-spacing: .03em; position: sticky; top: 0; }
  td { padding: 6px 9px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: inherit; z-index: 1; }
  th:first-child { background: var(--bg3); }
  tbody tr { background: var(--bg2); }
  tr.marca { cursor: pointer; }
  tr.marca:hover td { background: var(--bg3); }
  tr.marca.open td { background: #eef4fc; }
  tr.marca td { border-top: 2px solid var(--border2); font-size: 13px; padding-top: 8px; padding-bottom: 8px; }
  tr.marca td:first-child { font-weight: 700; font-size: 13.5px; }
  tr.marca.open td { background: #e3edfb !important; }
  tr.setor td { font-size: 12px; color: #3d444d; background: #f7f9fb !important; border-bottom: 1px dashed var(--border); }
  tr.setor td:first-child { padding-left: 40px; font-weight: 600; box-shadow: inset 4px 0 0 #b9c8dc; }
  tr.setor td:first-child::before { content: '└ '; color: var(--border2); }
  .ped td input.val { width: 92px; text-align: right; }
  .tag-nexo { background: rgba(26,127,55,.12); color: var(--green); }
  .tag-mes { background: rgba(130,80,223,.12); color: #8250df; }
  .dist input { width: 52px; text-align: right; font-size: 12px; padding: 2px 4px; }
  .dist td.tot { font-weight: 700; }
  .dist td.tot.ok { color: var(--green); } .dist td.tot.erro { color: var(--red); }
  tr.ajuste td { background: #fafbfc; text-align: left; font-size: 12px; }
  tr.ajuste input { width: 110px; text-align: right; }
  tfoot td { font-weight: 700; background: var(--bg3); }
  .seta { display: inline-block; width: 14px; color: var(--text2); }
  input.pct { width: 70px; text-align: right; padding: 2px 6px; font-size: 14px; font-weight: 700; color: var(--text); }
  input.pct::placeholder { color: var(--text); opacity: 1; }
  .pctbox { display: grid; gap: 3px; justify-items: end; }
  .pctbar { height: 4px; border-radius: 2px; background: var(--blue); opacity: .55; justify-self: end; }
  .btn-nova-marca { margin-left: 10px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--blue); background: transparent; color: var(--blue); cursor: pointer; }
  input.pct.dig { border-color: var(--yellow); background: #fff8e6; }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 9px; margin-left: 5px; }
  .tag-red { background: rgba(207,34,46,.12); color: var(--red); }
  .tag-man { background: rgba(9,105,218,.12); color: var(--blue); }
  #cp-msg { padding: 40px 16px; text-align: center; color: var(--text2); }
  #cp-err { display: none; background: rgba(207,34,46,.08); border: 1px solid var(--red); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; color: var(--red); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .conf td, .conf th { text-align: left; white-space: normal; }
  /* Grupos de colunas: 2-3 venda/cota · 4-6 pedidos · 7-8 estoque · 9-10 compra · 11-14 giro */
  table.grp th.gh { text-align: center; font-size: 10px; letter-spacing: .06em; border-bottom: 1px solid var(--border); }
  table.grp .g1 { background: #eef4fc; } table.grp .g2 { background: #fdf4e3; } table.grp .g3 { background: #eaf6ee; }
  table.grp .g4 { background: #f3effc; } table.grp .g5 { background: #f1f3f5; }
  table.grp tr > :nth-child(4), table.grp tr > :nth-child(7), table.grp tr > :nth-child(9), table.grp tr > :nth-child(11), table.grp tr > :nth-child(15), table.grp tr.gh-row > :nth-child(7),
  table.grp tr.gh-row > :nth-child(2), table.grp tr.gh-row > :nth-child(3), table.grp tr.gh-row > :nth-child(4), table.grp tr.gh-row > :nth-child(5), table.grp tr.gh-row > :nth-child(6) { border-left: 2px solid var(--border2); }
  table.grp tbody tr.marca > :nth-child(n+2):nth-child(-n+3), table.grp tfoot tr > :nth-child(n+2):nth-child(-n+3) { background: rgba(9,105,218,.04); }
  table.grp tbody tr.marca > :nth-child(n+4):nth-child(-n+6), table.grp tfoot tr > :nth-child(n+4):nth-child(-n+6) { background: rgba(191,135,0,.06); }
  table.grp tbody tr.marca > :nth-child(n+7):nth-child(-n+8), table.grp tfoot tr > :nth-child(n+7):nth-child(-n+8) { background: rgba(26,127,55,.05); }
  table.grp tbody tr.marca > :nth-child(n+9):nth-child(-n+10), table.grp tfoot tr > :nth-child(n+9):nth-child(-n+10) { background: rgba(130,80,223,.05); }
  table.grp tbody tr.marca:hover > td { filter: brightness(.97); }
  .abc { display: inline-block; width: 18px; height: 18px; line-height: 18px; border-radius: 50%; text-align: center; font-size: 10px; font-weight: 800; color: #fff; margin-right: 6px; vertical-align: 1px; }
  .abc-A { background: #1a7f37; } .abc-B { background: #d29922; } .abc-C { background: #cf222e; }
  tr.marca.cv-A > td:first-child { box-shadow: inset 4px 0 0 #1a7f37; }
  tr.marca.cv-B > td:first-child { box-shadow: inset 4px 0 0 #d29922; }
  tr.marca.cv-C > td:first-child { box-shadow: inset 4px 0 0 #cf222e; }
  .ped td input.pend { width: 92px; text-align: right; }
  .ped td input[type=date], .ped td input[type=text] { font-size: 12px; padding: 2px 5px; }
  .ped td input.dias { width: 92px; text-align: right; }
  .ped td input.dig, .ped td input[type=date].dig { border-color: var(--yellow); background: #fff8e6; }
  .ped tr.ign td { opacity: .45; }
  .ped .parc { font-size: 11px; color: var(--text2); white-space: normal; text-align: left; min-width: 220px; max-width: 360px; }
  .ped td.esq { text-align: left; white-space: normal; }
  .novo { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .novo label { display: grid; gap: 3px; font-size: 11px; color: var(--text2); }
  .novo input, .novo select { font-size: 12px; }
  .seg2 { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg2 button { background: none; border: none; color: var(--text2); padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .seg2 button.active { background: rgba(9,105,218,.1); color: var(--blue); font-weight: 600; }
  .conf td.n { text-align: right; }
  @media (max-width: 640px) { #cp-body { padding: 10px; margin-top: 110px; } .cp-filtros { margin-left: 0; } }
</style>
</head>
<body>
<div id="cp-topbar">
  <button class="cp-btn" onclick="location.href='/'">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>Voltar
  </button>
  <div class="cp-title">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    Planejamento de Compras
  </div>
  <div class="cp-filtros">
    <select id="cp-colecao" title="Coleção"></select>
    <span class="muted">% da venda:</span>
    <div class="seg" id="cp-dias"><button data-d="30">30 dias</button><button data-d="60">60 dias</button><button data-d="90" class="active">90 dias</button></div>
    <button class="cp-btn" id="cp-atualizar" title="Relê venda, estoque e pedidos do Microvix">Atualizar do Microvix</button>
  </div>
</div>

<div id="cp-body">
  <div id="cp-err"></div>
  <div id="cp-msg"><span class="spinner"></span> Lendo venda, estoque e pedidos do Microvix…</div>
  <div id="cp-main" style="display:none">
    <div class="abas" id="cp-abas"></div>
    <div id="cp-conteudo"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const N = v => v == null ? '' : Math.abs(v) < .5 ? '<span class="muted">—</span>' : (v < 0 ? '−' : '') + Math.abs(Math.round(v)).toLocaleString('pt-BR');
const NC = v => v == null ? '' : `<span class="${v < -.5 ? 'neg' : ''}">${N(v)}</span>`;
const P = (v, d = 1) => v == null ? '' : (v * 100).toFixed(d).replace('.', ',') + '%';
const X = v => v == null ? '<span class="muted">—</span>' : `<span class="${v < 0 ? 'neg' : v < 3 ? 'warn' : ''}">${v.toFixed(1).replace('.', ',')}</span>`;
const MKP = v => v == null ? '<span class="muted">—</span>' : v.toFixed(2).replace('.', ',');
const fmt0 = v => Math.round(v).toLocaleString('pt-BR');
const parseBR = t => { t = String(t).trim().replace(/[R$\s%]/g, ''); if (t === '') return null; const v = parseFloat(t.replace(/\./g, '').replace(',', '.')); return Number.isFinite(v) ? v : NaN; };
const EMP = { delrey: 'LMJ', minas: 'JDG', contagem: 'PV', estacao: 'TTS' };
const COR = { delrey: '#0969da', minas: '#1a7f37', contagem: '#bf8700', estacao: '#8250df' };
const nomeMes = mk => ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+mk.slice(5, 7) - 1] + '/' + mk.slice(2, 4);
const DM = s => s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(2, 4);

let D = null, aba = null, dias = 90;
const abertos = new Set();
try { dias = +localStorage.getItem('cp-dias') || 90; } catch {}

async function carregar(atualizar) {
  $('cp-msg').style.display = ''; $('cp-err').style.display = 'none';
  $('cp-msg').innerHTML = `<span class="spinner"></span> ${atualizar ? 'Relendo' : 'Lendo'} venda, estoque e pedidos do Microvix… (na primeira vez leva cerca de 30 s)`;
  $('cp-atualizar').disabled = true;
  try {
    const q = new URLSearchParams({ dias, ...($('cp-colecao').value ? { colecao: $('cp-colecao').value } : {}), ...(atualizar ? { atualizar: 1 } : {}) });
    const r = await fetch('/api/compras-plano?' + q);
    if (r.status === 401 || r.status === 403) { location.href = '/'; return; }
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    D = j;
    $('cp-colecao').innerHTML = D.colecoes.map(c => `<option${c === D.colecao ? ' selected' : ''}>${c}</option>`).join('');
    if (!aba || !(D.lojas.includes(aba) || ['marcas', 'conf', 'ped'].includes(aba))) aba = D.lojas[0];
    $('cp-msg').style.display = 'none'; $('cp-main').style.display = '';
    if (D.erros.length) { $('cp-err').style.display = ''; $('cp-err').textContent = 'Parte do Microvix não respondeu: ' + D.erros.join(' · '); }
    render();
  } catch (e) {
    $('cp-msg').style.display = 'none';
    $('cp-err').style.display = ''; $('cp-err').textContent = 'Erro ao carregar: ' + e.message;
  }
  $('cp-atualizar').disabled = false;
}

function render() {
  const nAlerta = b => { const a = D.porLoja[b].alertas; return a.pendMaior.length + a.semEstoque.length; };
  $('cp-abas').innerHTML = D.lojas.map(b => `<button class="aba${aba === b ? ' active' : ''}" data-a="${b}"><span style="color:${COR[b]}">●</span> <b>${EMP[b] || ''}</b> ${esc(D.labels[b])}</button>`).join('')
    + `<button class="aba${aba === 'marcas' ? ' active' : ''}" data-a="marcas">Marcas (todas as lojas)</button>`
    + `<button class="aba${aba === 'conf' ? ' active' : ''}" data-a="conf">Conferência${D.lojas.some(nAlerta) ? '<span class="alerta">●</span>' : ''}</button>`
    + `<button class="aba${aba === 'ped' ? ' active' : ''}" data-a="ped">Pedidos e pagamentos</button>`;
  if (aba === 'ped') { $('cp-conteudo').innerHTML = telaPedidos(); if (!PD || PD.filtro !== pedFiltro()) carregarPedidos(); return; }
  $('cp-conteudo').innerHTML = aba === 'marcas' ? telaMarcas() : aba === 'conf' ? telaConferencia() : telaLoja(aba);
  document.querySelectorAll('.dias-btn').forEach(b => b.classList.toggle('active', +b.dataset.d === dias));
}

const periodoTxt = () => `${nomeMes(D.periodo.ini)} a ${nomeMes(D.periodo.fim)}`;

function telaLoja(b) {
  const L = D.porLoja[b], p = L.premissas, d = L.digitado, pd = L.padrao, c = L.calc;
  const campo = (k, rot, ajuda, dec = 0) => `<label>${rot}<input type="text" class="prem-in${d[k] != null ? ' dig' : ''}" data-k="${k}" value="${d[k] != null ? String(d[k]).replace('.', ',') : ''}" placeholder="${dec ? String(pd[k]).replace('.', ',') : fmt0(pd[k])}" title="${esc(ajuda)} — vazio usa o calculado (${dec ? String(pd[k]).replace('.', ',') : fmt0(pd[k])})"></label>`;
  let h = `<div class="painel"><div class="painel-hd"><h2>Premissas — ${esc(D.labels[b])} · ${D.colecao} <span class="muted" style="font-weight:400">(${periodoTxt()})</span></h2>
    <span class="muted">amarelo = digitado · vazio = calculado</span></div>
    <div class="prem">
      ${campo('previsao', 'Previsão de venda (R$)', `Venda que falta até o fim da coleção (${D.meses.map(nomeMes).join(', ') || 'nenhum'}): no mês atual, projeção do Dash menos o vendido até ontem`)}
      ${campo('meses', 'Meses faltantes', 'Dias que faltam até o fim da coleção ÷ 30,4', 1)}
      ${campo('cmv', 'CMV médio (%)', `Custo médio ÷ venda dos últimos ${D.dias} dias da loja (Microvix)`, 1)}
      ${campo('vendaMedia', 'Venda média mensal (R$)', L.mediaAnualMeses ? `Base do mínimo: média mensal dos últimos ${L.mediaAnualMeses} meses fechados (Dash), para o fim de ano não inflar o mínimo` : `Base do mínimo: venda dos últimos ${D.dias} dias ÷ ${D.dias / 30} (sem histórico de 12 meses no Dash)`)}
      ${campo('cobertura', 'Cobertura (x) — você define', 'Estoque mínimo = N meses de venda a custo; defina por loja', 1)}
      <div class="calc" title="100 ÷ CMV: converte a venda real em custo">Markup pelo CMV<br><b>${c.markup.toFixed(2).replace('.', ',')}</b></div>
      <div class="calc" title="Preço de venda de tabela ÷ custo médio do estoque de hoje">Markup a preço cheio<br><b>${c.markupCheio == null ? '—' : c.markupCheio.toFixed(2).replace('.', ',')}</b></div>
      <div class="calc">Média mensal<br><b>R$ ${fmt0(c.mediaMensal)}</b></div>
      <div class="calc">Cota de compra<br><b>R$ ${fmt0(c.cotaTotal)}</b></div>
      <div class="calc">Estoque mínimo ${String(p.cobertura).replace('.', ',')}x<br><b>R$ ${fmt0(c.minimoTotal)}</b></div>
    </div></div>`;

  h += `<div class="painel"><div class="painel-hd"><h2>Marcas — clique para abrir os setores e o ajuste manual <button type="button" class="btn-nova-marca" title="Marca que ainda não vendeu na loja: entra com o % que você digitar">+ Marca nova</button></h2>
    <span class="muted">% da venda de ${DM(D.venda.dtIni)} a ${DM(D.venda.dtFin)} · ${L.pedidos} itens de pedido com entrega na coleção${L.estoqueDe ? ` · <b class="azul">estoque = previsão de sobra da ${L.estoqueDe}</b>` : ''}</span></div>
    <div class="scroll"><table class="grp"><thead>
      <tr class="gh-row"><th class="gh"></th><th class="gh g1" colspan="2">VENDA E COTA</th><th class="gh g2" colspan="3">PEDIDOS</th><th class="gh g3" colspan="2">ESTOQUE</th><th class="gh g4" colspan="2">COMPRA</th><th class="gh g5" colspan="4">GIRO</th><th class="gh g1">PREÇO</th></tr>
      <tr><th>Marca <span class="muted" style="text-transform:none;font-weight:400">· curva ABC</span></th><th title="Venda dos últimos dias, ou digitado">% venda</th><th title="Previsão × CMV, rateada pelo %">Cota compra</th>
      <th title="Pedidos de compra com entrega na coleção, sem cancelados (a custo)">Realizado</th><th>% entregue</th><th title="Pedido − entregue">Pendente</th>
      <th title="Saldo × custo médio">Estoque</th><th title="Venda média ÷ markup × cobertura, rateado pelo %">Est. mínimo</th>
      <th title="Cota + mínimo − estoque">Necessidade</th><th title="Necessidade − pendente">Saldo p/ comprar</th>
      <th title="Média mensal × % ÷ markup (a custo)">Fat. mensal</th><th title="(Estoque − mínimo) ÷ fat. mensal">Cobert.</th><th title="Com o pendente">Cobert. c/ pend.</th>
      <th title="Pendente + estoque − fat. mensal × meses">Previsão sobra</th><th title="Preço de venda de tabela ÷ custo médio do estoque de hoje (preço cheio)">Markup cheio</th></tr></thead><tbody>`;
  const maxPct = Math.max(...L.linhas.map(x => x.pct), 0);
  for (const l of L.linhas) {
    const k = b + '|' + l.marca, ab = abertos.has(k);
    const manual = l.ajRealizado || l.ajPendente;
    h += `<tr class="marca cv-${l.curva}${ab ? ' open' : ''}" data-k="${esc(k)}">

      <td><div class="pctbox"><input type="text" class="pct${l.pctDigitado != null ? ' dig' : ''}" data-m="${esc(l.marca)}" value="${l.pctDigitado != null ? P(l.pctDigitado, 2) : ''}" placeholder="${P(l.pctVenda, 1)}" title="Venda: ${P(l.pctVenda, 2)} (R$ ${fmt0(l.venda)}). Digite para fixar; vazio volta para a venda."><div class="pctbar" style="width:${Math.min(70, Math.round(l.pct / (maxPct || 1) * 70))}px"></div></div></td>
      <td>${N(l.cota)}</td><td>${N(l.realizado)}</td><td>${l.entregue == null ? '' : P(l.entregue, 0)}</td><td>${N(l.pendente)}</td>
      <td>${N(l.estoque)}</td><td>${N(l.minimo)}</td><td>${NC(l.necessidade)}</td><td class="${l.saldoComprar > .5 ? 'azul' : ''}">${NC(l.saldoComprar)}</td>

      <td>${N(s.estoque)}</td><td>${N(s.minimo)}</td><td>${NC(s.necessidade)}</td><td>${NC(s.saldoComprar)}</td><td>${N(s.fatMensal)}</td><td>${X(s.cobertura)}</td><td>${X(s.coberturaPend)}</td><td>${NC(s.sobra)}</td><td>${MKP(s.markup)}</td></tr>`;

      realizado <input type="text" class="aj" data-m="${esc(l.marca)}" data-c="realizado" value="${l.ajRealizado ? fmt0(l.ajRealizado) : ''}" placeholder="0">
      pendente <input type="text" class="aj" data-m="${esc(l.marca)}" data-c="pendente" value="${l.ajPendente ? fmt0(l.ajPendente) : ''}" placeholder="0">
      <span class="muted"> · do Microvix: realizado R$ ${fmt0(l.realizadoMx)}, pendente R$ ${fmt0(l.pendenteMx)}</span></td></tr>`;
  }
  const t = L.total;
  h += `</tbody><tfoot><tr><td>Total</td><td>${P(t.pct, 1)}</td><td>${N(t.cota)}</td><td>${N(t.realizado)}</td><td>${t.entregue == null ? '' : P(t.entregue, 0)}</td><td>${N(t.pendente)}</td>
    <td>${N(t.estoque)}</td><td>${N(t.minimo)}</td><td>${NC(t.necessidade)}</td><td>${NC(t.saldoComprar)}</td><td>${N(t.fatMensal)}</td><td></td><td></td><td>${NC(t.sobra)}</td><td>${MKP(t.markup)}</td></tr></tfoot></table></div>
    <div class="nota">Realizado e pendente vêm dos pedidos de compra do Microvix com previsão de entrega de ${periodoTxt()} (sem previsão, pela data do pedido); cancelados ficam de fora e pedido encerrado não tem pendente. Estoque = saldo de hoje × custo médio; numa coleção que ainda não começou, é a previsão de sobra da coleção anterior (marca e setor, sem negativo). Coluna "Saldo p/ comprar" em azul = ainda cabe comprar; negativo = já comprou além da cota.
    Cobertura em meses: vermelho abaixo de zero, amarelo abaixo de 3.</div></div>`;
  return h;
}

function telaMarcas() {
  const m = {};
  for (const b of D.lojas) for (const l of D.porLoja[b].linhas) {
    const x = (m[l.marca] ||= { marca: l.marca, cota: 0, realizado: 0, pendente: 0, estoque: 0, necessidade: 0, saldoComprar: 0, lojas: {} });
    for (const k of ['cota', 'realizado', 'pendente', 'estoque', 'necessidade', 'saldoComprar']) x[k] += l[k];
    x.lojas[b] = l;
  }
  const lista = Object.values(m).sort((a, c) => c.cota - a.cota || c.estoque - a.estoque);
  const tot = k => lista.reduce((s, x) => s + x[k], 0);
  let h = `<div class="painel"><div class="painel-hd"><h2>Marcas — ${D.colecao}, soma das lojas</h2><span class="muted">clique numa marca para ver por loja</span></div>
    <div class="scroll"><table><thead><tr><th>Marca</th><th>Cota compra</th><th>Realizado</th><th>Pendente</th><th>Estoque</th><th>Necessidade</th><th>Saldo p/ comprar</th><th>% da cota</th></tr></thead><tbody>`;
  for (const x of lista) {
    const k = 'marcas|' + x.marca, ab = abertos.has(k);
    h += `<tr class="marca${ab ? ' open' : ''}" data-k="${esc(k)}"><td><span class="seta">${ab ? '▾' : '▸'}</span>${esc(x.marca)}</td><td>${N(x.cota)}</td><td>${N(x.realizado)}</td><td>${N(x.pendente)}</td>
      <td>${N(x.estoque)}</td><td>${NC(x.necessidade)}</td><td class="${x.saldoComprar > .5 ? 'azul' : ''}">${NC(x.saldoComprar)}</td><td>${P(x.cota / (tot('cota') || 1), 1)}</td></tr>`;
    if (ab) for (const b of D.lojas) { const l = x.lojas[b]; if (!l) continue;
      h += `<tr class="setor"><td><span style="color:${COR[b]}">●</span> ${esc(D.labels[b])}</td><td>${N(l.cota)}</td><td>${N(l.realizado)}</td><td>${N(l.pendente)}</td><td>${N(l.estoque)}</td><td>${NC(l.necessidade)}</td><td>${NC(l.saldoComprar)}</td><td>${P(l.pct, 1)} <span class="muted">da loja</span></td></tr>`; }
  }
  h += `</tbody><tfoot><tr><td>Total</td><td>${N(tot('cota'))}</td><td>${N(tot('realizado'))}</td><td>${N(tot('pendente'))}</td><td>${N(tot('estoque'))}</td><td>${NC(tot('necessidade'))}</td><td>${NC(tot('saldoComprar'))}</td><td></td></tr></tfoot></table></div></div>`;
  return h;
}

function telaConferencia() {
  let h = `<div class="painel"><div class="painel-hd"><h2>Conferência — ${D.colecao}</h2></div><div class="scroll"><table class="conf"><thead><tr>
    <th>Loja</th><th>Marcas</th><th>Soma % venda</th><th>Pendente maior que realizado</th><th>% de venda sem estoque</th><th>Realizado</th><th>Pendente</th><th>Status</th></tr></thead><tbody>`;
  for (const b of D.lojas) {
    const L = D.porLoja[b], a = L.alertas, ok = !a.pendMaior.length && !a.semEstoque.length;
    h += `<tr><td><b>${esc(D.labels[b])}</b></td><td class="n">${L.linhas.length}</td><td class="n">${P(L.total.pct, 1)}</td>

}

// ── Pedidos e pagamentos ──
let PD = null, pedVer = 'abertos';
const pedFiltro = () => pedVer === 'abertos' ? 'abertos' : D.colecao;
const fmtParc = ps => ps.length ? ps.map(p => `${DM(p.d)} <b>${fmt0(p.valor)}</b>`).join(' · ') : '<span class="muted">—</span>';
async function carregarPedidos(atualizar) {
  PD = { filtro: pedFiltro(), carregando: true };
  if (aba === 'ped') $('cp-conteudo').innerHTML = telaPedidos();
  try {
    const q = new URLSearchParams({ ...(pedVer === 'colecao' ? { colecao: D.colecao } : {}), ...(atualizar ? { atualizar: 1 } : {}) });
    const r = await fetch('/api/compras-plano/pedidos?' + q);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    PD = { ...j, filtro: pedFiltro() };
  } catch (e) { PD = { filtro: pedFiltro(), erro: e.message }; }
  if (aba === 'ped') $('cp-conteudo').innerHTML = telaPedidos();
}

        <td class="tot ${!soma ? '' : Math.abs(soma - 100) < .5 ? 'ok' : 'erro'}">${soma ? String(soma).replace('.', ',') + '%' : '<span class="muted">entrega única</span>'}</td></tr>`;

  }
  h += `<div class="scroll"><table class="ped"><thead><tr><th>Loja</th><th>Pedido</th><th>Marcas</th><th>Data</th><th title="Previsão de entrega; digite para mudar (vale para a coleção e para o pagamento)">Entrega</th>

    <th style="text-align:left">Parcelas do pendente (prévia — ainda fora do Fluxo de Caixa)</th><th title="Desmarque para tirar este pedido do Fluxo de Caixa">No fluxo</th><th></th></tr></thead><tbody>`;
  for (const p of lista) {

    h += `<tr class="${p.ignorar ? 'ign' : ''}"><td><span style="color:${COR[p.b]}">●</span> ${esc(D.labels[p.b])}</td>

      <td>${p.manual ? N(p.valor) : `<input type="text" class="val p-val${p.valorDig != null ? ' dig' : ''}" data-i="${i}" value="${p.valorDig != null ? fmt0(p.valorDig) : ''}" placeholder="${fmt0(p.valorMx)}" title="Digite para corrigir; vazio volta ao do pedido">`}</td><td>${N(p.entregue)}</td>

      <td><input type="text" class="dias p-dias${p.diasDig && !p.manual ? ' dig' : ''}" data-i="${i}" value="${p.diasDig || ''}" placeholder="${p.diasPadrao}"></td>
      <td class="parc">${fmtParc(p.parcelas)}</td>
      <td style="text-align:center">${p.manual ? `<label title="Recebido: sai do pendente"><input type="checkbox" class="p-rec" data-i="${i}"${p.recebido ? ' checked' : ''}> recebido</label>` : `<input type="checkbox" class="p-fluxo" data-i="${i}"${p.ignorar ? '' : ' checked'}>`}</td>
      <td>${p.manual ? `<button class="cp-btn p-del" data-i="${i}" title="Apagar">×</button>` : ''}</td></tr>`;
  }
  h += `</tbody><tfoot><tr><td>Total</td><td>${lista.length}</td><td></td><td></td><td></td><td>${N(tot('valor'))}</td><td>${N(tot('entregue'))}</td><td>${N(tot('pendente'))}</td><td></td><td></td><td></td><td></td><td></td></tr></tfoot></table></div>
    <div class="nota">O planejamento da coleção usa os pedidos do NEXO (pelo nº do pedido no Microvix; os "a lançar" entram todo pendentes, pelo custo do NEXO) e os manuais. Pedido do Microvix fora do NEXO aparece aqui e no fluxo, mas não no planejamento. Valor e pendente são editáveis (amarelo).<br>Pedidos de compra do Microvix (sem cancelados) e os lançados aqui. A entrega e o prazo digitados ficam em amarelo; vazio usa o do Microvix (o plano "COMPRA 3X" vira 30/60/90 dias da entrega).
    Só o <b>pendente</b> vira parcela no Fluxo de Caixa (categoria Mercadoria): o que já chegou tem fatura no Microvix. Entrega que já passou e segue pendente conta a partir de hoje; com mais de 60 dias de atraso o pedido fica fora do fluxo (provável saldo não encerrado no Microvix) até você marcar "No fluxo".
    ${PD.erros?.length ? '<br><span class="neg">Não leu: ' + esc(PD.erros.join(' · ')) + '</span>' : ''}</div></div>`;
  return h;

async function pedPut(corpo) {
  const r = await fetch('/api/compras-plano/pedido', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
  if (!r.ok) throw new Error((await r.json()).error || r.status);
}
async function manualSalvar(p, mudar) {
  const corpo = { loja: p.b, marca: p.marcas[0], setor: p.setor || '', valor: p.valor, entrega: p.entrega, dias: p.dias, obs: p.obs, recebido: p.recebido, ...mudar };
  const r = await fetch('/api/compras-plano/manual/' + p.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
  if (!r.ok) throw new Error((await r.json()).error || r.status);
}
$('cp-conteudo').addEventListener('change', async e => {
  const t = e.target;
  if (t.matches('.dist-in')) {
    const v = parseBR(t.value); if (Number.isNaN(v)) return alert('Informe o %, ex.: 30');
    try {
      const r = await fetch('/api/compras-plano/entrega', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ colecao: PD.distribuicao.colecao, marca: t.dataset.m, mes: t.dataset.mes, pct: v }) });
      if (!r.ok) throw new Error((await r.json()).error || r.status);
      await carregarPedidos();
    } catch (err) { alert('Não salvou: ' + err.message); }
    return;
  }
  if (!PD?.lista || !t.dataset.i) return;
  const p = PD.lista[+t.dataset.i];
  try {
    if (t.matches('.p-ent')) p.manual ? await manualSalvar(p, { entrega: t.value }) : await pedPut({ b: p.b, pedido: p.pedido, entrega: t.value || null });
    else if (t.matches('.p-dias')) p.manual ? await manualSalvar(p, { dias: t.value || '30' }) : await pedPut({ b: p.b, pedido: p.pedido, dias: t.value || null });
    else if (t.matches('.p-fluxo')) await pedPut({ b: p.b, pedido: p.pedido, ignorar: !t.checked });
    else if (t.matches('.p-val')) { const v = parseBR(t.value); if (Number.isNaN(v)) return alert('Valor inválido'); await pedPut({ b: p.b, pedido: p.pedido, valor: v }); }
    else if (t.matches('.p-pend')) { const v = parseBR(t.value); if (Number.isNaN(v)) return alert('Valor inválido'); await pedPut({ b: p.b, pedido: p.pedido, pendente: v }); }
    else if (t.matches('.p-rec')) await manualSalvar(p, { recebido: t.checked });
    else return;
    await carregarPedidos(); carregar(false);
  } catch (err) { alert('Não salvou: ' + err.message); }
});
$('cp-conteudo').addEventListener('click', async e => {
  const z = e.target.closest('#ped-zerar, #ped-desfazer');
  if (z) {
    const desfazer = z.id === 'ped-desfazer';
    if (!confirm(desfazer ? `Voltar o pendente de todos os pedidos da ${D.colecao} ao que está no Microvix?` : `Zerar o pendente de todos os pedidos do Microvix com entrega na ${D.colecao}? Depois você digita o pendente certo pedido a pedido.`)) return;
    const r = await fetch('/api/compras-plano/zerar-pendentes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ colecao: D.colecao, desfazer }) });
    const j = await r.json(); if (!r.ok) return alert('Não fez: ' + (j.error || r.status));
    pedVer = 'colecao'; await carregarPedidos(); carregar(false); return;
  }
  const v = e.target.closest('#ped-ver button');
  if (v) { pedVer = v.dataset.v; PD = null; render(); return; }
  if (e.target.closest('#nm-add')) {
    const corpo = { loja: $('nm-loja').value, marca: $('nm-marca').value, setor: $('nm-setor').value, valor: parseBR($('nm-valor').value),
      entrega: $('nm-entrega').value, dias: $('nm-dias').value, obs: $('nm-obs').value };
    try {
      const r = await fetch('/api/compras-plano/manual', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
      if (!r.ok) throw new Error((await r.json()).error || r.status);
      await carregarPedidos(); carregar(false);
    } catch (err) { alert('Não lançou: ' + err.message); }
    return;
  }
  const del = e.target.closest('.p-del');
  if (del) {
    const p = PD.lista[+del.dataset.i];
    if (!confirm(`Apagar o pedido manual de ${p.marcas.join(', ')} (R$ ${fmt0(p.valor)})?`)) return;
    const r = await fetch('/api/compras-plano/manual/' + p.id, { method: 'DELETE' });
    if (!r.ok) return alert('Não apagou');
    await carregarPedidos(); carregar(false);
  }
});

// ── Eventos ──
$('cp-abas').addEventListener('click', e => { const b = e.target.closest('.aba'); if (!b) return; aba = b.dataset.a; render(); window.scrollTo({ top: 0 }); });
$('cp-conteudo').addEventListener('click', async e => {
  if (e.target.closest('.btn-nova-marca')) {
    const nome = (prompt('Nome da marca nova (como está no Microvix):') || '').trim().toUpperCase();
    if (!nome) return;
    if (D.porLoja[aba].linhas.some(l => l.marca === nome)) return alert(nome + ' já está na lista: digite o % na linha dela.');
    const v = parseBR(prompt(`% da venda que ${nome} deve ter na loja (ex.: 2 ou 2,5):`) || '');
    if (v == null || Number.isNaN(v) || v <= 0) return alert('Informe um % maior que zero');
    try { await salvar({ pct: { [nome]: v / 100 } }); } catch (err) { alert('Não salvou: ' + err.message); }
    return;
  }
  if (e.target.closest('input')) return;
  const tr = e.target.closest('tr.marca'); if (!tr) return;
  abertos.has(tr.dataset.k) ? abertos.delete(tr.dataset.k) : abertos.add(tr.dataset.k);
  render();
});
$('cp-conteudo').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input')) e.target.blur(); });
async function salvar(corpo) {
  const r = await fetch('/api/compras-plano', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ colecao: D.colecao, loja: aba, ...corpo }) });
  if (!r.ok) throw new Error((await r.json()).error || r.status);
  await carregar(false);
}
$('cp-conteudo').addEventListener('change', async e => {
  const t = e.target;
  try {
    if (t.matches('.prem-in')) {
      const v = parseBR(t.value);
      if (Number.isNaN(v)) return alert('Número inválido');
      await salvar({ premissa: { [t.dataset.k]: v } });
    } else if (t.matches('.pct')) {
      const v = parseBR(t.value);
      if (Number.isNaN(v)) return alert('Informe o %, ex.: 18 ou 18,5');
      await salvar({ pct: { [t.dataset.m]: v == null ? null : v / 100 } });
    } else if (t.matches('.aj')) {
      const tr = t.closest('tr');
      const val = c => parseBR(tr.querySelector(`.aj[data-c="${c}"]`).value) || 0;
      await salvar({ ajuste: { [t.dataset.m]: { realizado: val('realizado'), pendente: val('pendente') } } });
    }
  } catch (err) { alert('Não salvou: ' + err.message); }
});
$('cp-dias').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  dias = +b.dataset.d; try { localStorage.setItem('cp-dias', dias); } catch {}
  document.querySelectorAll('#cp-dias button').forEach(x => x.classList.toggle('active', x === b));
  carregar(false);
});
$('cp-colecao').addEventListener('change', () => { PD = null; carregar(false); });
$('cp-atualizar').addEventListener('click', () => { PD = null; carregar(true); });
document.querySelectorAll('#cp-dias button').forEach(x => x.classList.toggle('active', +x.dataset.d === dias));
carregar(false);
</script>
</body>
