<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRE/Resultados</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<style>
  :root { --bg:#f4f6f9; --bg2:#fff; --bg3:#f0f3f7; --border:#dde3ea; --text:#1f2328; --text2:#636c76;
    --green:#1a7f37; --red:#cf222e; --yellow:#9a6700; --yellowbg:#fff8c5; --blue:#0969da; color-scheme:light; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  header { background:var(--bg2); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; font-weight:600; margin-right:auto; }
  input, button { background:var(--bg3); border:1px solid var(--border); border-radius:6px; padding:5px 10px; font-size:12px; color:var(--text); }
  button { cursor:pointer; } button:hover { color:var(--blue); border-color:var(--blue); }
  main { padding:16px; max-width:1300px; }
  .painel { background:var(--bg2); border:1px solid var(--border); border-radius:8px; margin-bottom:16px; overflow-x:auto; }
  .painel h2 { font-size:13px; font-weight:600; padding:10px 14px; border-bottom:1px solid var(--border); }
  .manual { background:var(--yellowbg); border-color:#d4a72c; }
  .manual h2 { border-color:#d4a72c; color:var(--yellow); }
  .manual.ok { background:#dafbe1; border-color:#4ac26b; } .manual.ok h2 { color:var(--green); border-color:#4ac26b; }
  .item { display:flex; align-items:center; gap:10px; padding:7px 14px; flex-wrap:wrap; }
  .item b { min-width:90px; } .item .feito { color:var(--green); } .item .pend { color:var(--yellow); font-weight:600; }
  .item input[type=number] { width:130px; background:#fff; } .item span.r { flex:1; min-width:220px; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  th, td { padding:7px 12px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; position:sticky; left:0; background:var(--bg2); }
  thead th { background:var(--bg3); font-size:12px; color:var(--text2); }
  tr.total td { font-weight:700; background:var(--bg3); }
  td small { display:block; color:var(--text2); font-size:11px; }
  .abas { display:flex; gap:6px; padding:0 0 12px; }
  .abas button.ativa { color:var(--blue); border-color:var(--blue); font-weight:600; }
  tr.abre { cursor:pointer; } tr.abre td:first-child::before { content:'▸ '; color:var(--text2); }
  tr.abre.aberta td:first-child::before { content:'▾ '; }
  tr.sub td { background:var(--bg3); font-size:12px; color:var(--text2); } tr.sub td:first-child { background:var(--bg3); padding-left:30px; white-space:normal; min-width:240px; }
  .filtros { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding-bottom:12px; } select { background:var(--bg3); border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:12px; }
  .dif { color:var(--red); } .falta { color:var(--yellow); font-weight:600; }
  .nota { color:var(--text2); padding:0 2px 14px; line-height:1.6; }
  #msg { padding:20px; color:var(--text2); }
</style>
</head>
<body>
<header>
  <h1>DRE/Resultados</h1>
  <label>Mês <input type="month" id="mes"></label>
  <button id="recalcular" title="Busca de novo no Microvix">Recalcular</button>
</header>
<main>
  <div id="msg">Carregando…</div>
  <div id="conteudo" hidden>
    <div class="painel manual" id="manuais"></div>
    <div class="abas"><button id="abaDre" class="ativa">DRE</button><button id="abaCaixa">Fechamento de Caixa</button><button id="abaAno">Consolidado do ano</button></div>
    <div id="vDre">
      <div class="painel"><h2 id="titulo"></h2><table id="tabela"></table></div>
      <p class="nota" id="nota"></p>
    </div>
    <div id="vAno" hidden>
      <div class="filtros">
        <label>Ano <input type="number" id="anoSel" style="width:80px"></label>
        <label>Visão <select id="anoVisao"><option value="dre">DRE</option><option value="caixa">Fechamento de Caixa</option></select></label>
        <label>Mostrar <select id="anoModo"><option value="mes">Mês a mês</option><option value="loja">Por loja</option></select></label>
        <label id="anoLojaRot">Loja <select id="anoLoja"></select></label>
        <span id="anoMsg"></span>
      </div>
      <div class="painel"><table id="tabelaAno"></table></div>
      <p class="nota">Traço indica mês sem o dado. Mês sem boleto ou sem folha sai parcial. A primeira abertura busca mês a mês e pode demorar; depois fica guardado.</p>
    </div>
    <div id="vCaixa" hidden>
      <div class="painel"><h2 id="tituloCaixa"></h2><table id="tabelaCaixa"></table></div>
      <p class="nota">Só o que foi pago, pelo vencimento, como na skill do Fechamento de Caixa. Clique na linha para ver os fornecedores.</p>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const num = v => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// Diferença acima disso aparece em vermelho: arredondamento não é erro.
const TOLERANCIA = 50;

function celula(valor, ref) {
  if (valor == null) return '<td class="falta">falta</td>';
  let extra = '';
  if (ref != null) {
    const d = valor - ref;
    extra = `<small class="${Math.abs(d) > TOLERANCIA ? 'dif' : ''}">planilha ${num(ref)}</small>`;
  }
  return `<td>${num(valor)}${extra}</td>`;
}

function desenhar(d) {
  const nome = b => d.labels[b] || b;
  const falta = d.pendencias.length;
  $('manuais').className = 'painel manual' + (falta ? '' : ' ok');
  $('manuais').innerHTML = `<h2>Antes de finalizar: ${falta ? falta + ' item(ns) manual(is) em aberto' : 'itens manuais completos'}</h2>${
    d.manuais.map(i => {
      const estado = i.feito ? '<span class="feito">✓ ok</span>' : '<span class="pend">falta</span>';
      const campo = i.tipo === 'numero'
        ? `<input type="number" step="0.01" data-loja="${i.loja}" data-campo="${i.id}" value="${i.valor ?? ''}">`
        : i.tipo === 'arquivo' ? `<input type="file" multiple accept="${i.id === 'boleto' ? '.pdf' : '.xlsx'}" class="arquivo">` : '';
      return `<div class="item"><b>${nome(i.loja)}</b><span class="r">${i.rotulo}</span>${campo}${estado}</div>`;
    }).join('')}`;
  document.querySelectorAll('#manuais input[type=number]').forEach(el => el.addEventListener('change', () => salvar(el)));
  document.querySelectorAll('#manuais .arquivo').forEach(el => el.addEventListener('change', () => enviar(el)));
  const [a, m] = d.mes.split('-');
  $('titulo').textContent = `DRE de ${m}/${a}`;
  const cab = `<thead><tr><th>Linha</th>${d.ordem.map(b => `<th>${nome(b)}</th>`).join('')}</tr></thead>`;
  const subs = itens => itens.map(i => `<tr class="sub" hidden><td>${i.nome}</td>${d.ordem.map(b =>
    `<td>${i.lojas[b] ? num(i.lojas[b]) : ''}</td>`).join('')}</tr>`).join('');
  const corpo = d.estrutura.map(([k, rot, tipo]) => {
    const itens = d.detalhe?.[k] || [];
    const pct = b => (tipo === 'total' && d.lojas[b].receita ? `<small>${num(d.lojas[b][k] / d.lojas[b].receita * 100)}%</small>` : '');
    return `<tr class="${[itens.length ? 'abre' : '', tipo === 'total' ? 'total' : ''].join(' ')}"><td>${rot}</td>${d.ordem.map(b =>
      celula(d.lojas[b][k], d.planilha?.[b]?.[k]).replace('</td>', pct(b) + '</td>')).join('')}</tr>${subs(itens)}`;
  }).join('');
  const parciais = d.ordem.filter(b => d.lojas[b].faltam.length);
  $('tabela').innerHTML = cab + `<tbody>${corpo}</tbody>`;
  $('tituloCaixa').textContent = `Fechamento de Caixa de ${m}/${a}`;
  const linhaTotal = (rot, valores) => `<tr class="total"><td>${rot}</td>${d.ordem.map(b => `<td>${num(valores[b] || 0)}</td>`).join('')}</tr>`;
  $('tabelaCaixa').innerHTML = cab + '<tbody>' + d.caixa.linhas.map(l =>
    `<tr class="${l.detalhe.length ? 'abre' : ''}"><td>${l.nome}</td>${d.ordem.map(b =>
      `<td>${l.lojas[b] ? num(l.lojas[b]) : ''}</td>`).join('')}</tr>${subs(l.detalhe)}`).join('') +
    linhaTotal('Soma despesas (-)', d.caixa.soma) + linhaTotal('Recebimentos (+)', d.caixa.recebimentos) +
    linhaTotal('Resultado (=)', d.caixa.resultado) + '</tbody>';
  document.querySelectorAll('tr.abre').forEach(tr => tr.addEventListener('click', () => {
    tr.classList.toggle('aberta');
    for (let n = tr.nextElementSibling; n && n.classList.contains('sub'); n = n.nextElementSibling) n.hidden = !n.hidden;
  }));
  const quando = d.conferenciaEm ? new Date(d.conferenciaEm).toLocaleString('pt-BR') : '';
  const abertas = d.ordem.filter(b => !d.folhaFechada[b] && b !== 'site').map(nome);
  $('nota').textContent = (parciais.length ? `Resultado parcial em ${parciais.map(nome).join(', ')}: falta informar as linhas marcadas. ` : '') +
    (abertas.length ? `Folha ainda aberta em ${abertas.join(', ')}. ` : '') +
    `Faturas pelo vencimento, pagas ou em aberto. Conferência lida em ${quando}.`;
}

async function salvar(el) {
  const r = await fetch('/api/dre-resultados/manual', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mes: $('mes').value, loja: el.dataset.loja, campo: el.dataset.campo, valor: el.value }) });
  if (!r.ok) alert((await r.json()).error || 'Não foi possível salvar');
  carregar(false);
}

async function enviar(el) {
  let mes = null;
  for (const arquivo of el.files) {
    const fd = new FormData();
    fd.append('arquivo', arquivo);
    const r = await fetch('/api/dre-resultados/importar', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) { alert(`${arquivo.name}: ${d.error || 'não foi possível importar'}`); continue; }
    mes = d.mes;
  }
  if (mes && mes !== $('mes').value) {
    alert(`O arquivo é de ${mes.split('-').reverse().join('/')}. Abrindo esse mês.`);
    $('mes').value = mes;
  }
  cache = {};
  carregar(false);
}

async function carregar(recalcular) {
  $('msg').hidden = false; $('msg').textContent = 'Carregando…'; $('conteudo').hidden = true;
  try {
    const r = await fetch(`/api/dre-resultados?mes=${$('mes').value}${recalcular ? '&recalcular=1' : ''}`);
    if (r.status === 401 || r.status === 403) { location.href = '/'; return; }
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Erro ao carregar');
    desenhar(d);
    $('msg').hidden = true; $('conteudo').hidden = false;
  } catch (e) { $('msg').textContent = 'Não foi possível carregar: ' + e.message; }
}

// Abre no último mês fechado
const ref = new Date(); ref.setDate(1); ref.setMonth(ref.getMonth() - 1);
$('mes').value = `${ref.getFullYear()}-${String(ref.getMonth() + 1).padStart(2, '0')}`;
const aba = qual => {
  for (const [v, b, k] of [['vDre', 'abaDre', 'dre'], ['vCaixa', 'abaCaixa', 'caixa'], ['vAno', 'abaAno', 'ano']]) {
    $(v).hidden = k !== qual; $(b).classList.toggle('ativa', k === qual);
  }
  if (qual === 'ano') carregarAno();
};
$('abaDre').addEventListener('click', () => aba('dre'));
$('abaCaixa').addEventListener('click', () => aba('caixa'));
$('abaAno').addEventListener('click', () => aba('ano'));

// Consolidado: lê o mesmo retorno de cada mês e soma aqui.
let cache = {};
const MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
async function carregarAno() {
  const ano = +$('anoSel').value, hoje = new Date();
  const ultimo = ano < hoje.getFullYear() ? 12 : ano === hoje.getFullYear() ? hoje.getMonth() + 1 : 0;
  for (let m = 1; m <= ultimo; m++) {
    const mk = `${ano}-${String(m).padStart(2, '0')}`;
    if (cache[mk]) continue;
    $('anoMsg').textContent = `Lendo ${MESES[m - 1]}/${ano}…`;
    try { const r = await fetch('/api/dre-resultados?mes=' + mk); if (r.ok) cache[mk] = await r.json(); } catch {}
    desenharAno();
  }
  $('anoMsg').textContent = '';
  desenharAno();
}
function valorDe(d, id, lojas, visao) {
  if (!d) return null;
  if (visao === 'dre') {
    const vs = lojas.map(b => d.lojas[b]?.[id]);
    return vs.every(v => v == null) ? null : vs.reduce((s, v) => s + (v || 0), 0);
  }
  const fonte = id === 'soma' ? d.caixa.soma : id === 'recebimentos' ? d.caixa.recebimentos : id === 'resultado' ? d.caixa.resultado
    : d.caixa.linhas.find(l => l.id === id)?.lojas || {};
  return lojas.reduce((s, b) => s + (fonte[b] || 0), 0);
}
function desenharAno() {
  const ano = $('anoSel').value, visao = $('anoVisao').value, modo = $('anoModo').value;
  const meses = Object.keys(cache).filter(k => k.startsWith(ano + '-')).sort();
  if (!meses.length) { $('tabelaAno').innerHTML = ''; return; }
  const base = cache[meses[0]], ordem = base.ordem, nome = b => base.labels[b] || b;
  $('anoLojaRot').hidden = modo === 'loja';
  if (!$('anoLoja').options.length) $('anoLoja').innerHTML = '<option value="">Consolidado</option>' + ordem.map(b => `<option value="${b}">${nome(b)}</option>`).join('');
  const lojas = $('anoLoja').value ? [$('anoLoja').value] : ordem;
  let linhas;
  if (visao === 'dre') linhas = base.estrutura.map(([id, rot, tipo]) => [id, rot, tipo]);
  else {
    const vistos = new Map();
    for (const mk of meses) for (const l of cache[mk].caixa.linhas) vistos.set(l.id, l.nome);
    linhas = [...vistos].map(([id, rot]) => [id, rot, 'item']).concat([['soma', 'Soma despesas (-)', 'total'], ['recebimentos', 'Recebimentos (+)', 'total'], ['resultado', 'Resultado (=)', 'total']]);
  }
  const cel = v => `<td>${v == null ? '–' : num(v)}</td>`;
  const soma = vs => (vs.every(v => v == null) ? null : vs.reduce((s, v) => s + (v || 0), 0));
  const cab = modo === 'mes' ? meses.map(mk => MESES[+mk.slice(5) - 1]) : ordem.map(nome);
  const corpo = linhas.map(([id, rot, tipo]) => {
    const vs = modo === 'mes' ? meses.map(mk => valorDe(cache[mk], id, lojas, visao))
      : ordem.map(b => soma(meses.map(mk => valorDe(cache[mk], id, [b], visao))));
    return `<tr class="${tipo === 'total' ? 'total' : ''}"><td>${rot}</td>${vs.map(cel).join('')}${cel(soma(vs))}</tr>`;
  }).join('');
  $('tabelaAno').innerHTML = `<thead><tr><th>Linha</th>${cab.map(c => `<th>${c}</th>`).join('')}<th>Total</th></tr></thead><tbody>${corpo}</tbody>`;
}
for (const id of ['anoVisao', 'anoModo', 'anoLoja']) $(id).addEventListener('change', desenharAno);
$('anoSel').addEventListener('change', carregarAno);
$('anoSel').value = new Date().getFullYear();
$('mes').addEventListener('change', () => carregar(false));
$('recalcular').addEventListener('click', () => carregar(true));
carregar(false);
</script>
</body>
</html>
